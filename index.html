          };
        });

        const refreshBubble = () => { const b = document.querySelector('.wa-preview-bubble'); if (b) b.textContent = buildWhatsAppInvoice('DEA-PREVIEW').text; };
        if (byId('input-address')) byId('input-address').oninput = (e) => { state.deliveryInfo.address = e.target.value; refreshBubble(); persistDeliveryPreferences(); };
        if (byId('input-ref')) byId('input-ref').oninput = (e) => { state.deliveryInfo.reference = e.target.value; refreshBubble(); persistDeliveryPreferences(); };
        if (byId('input-name')) byId('input-name').oninput = (e) => { state.deliveryInfo.customerName = e.target.value; refreshBubble(); persistDeliveryPreferences(); };

        document.querySelectorAll('[data-pay-method]').forEach((el) => { el.onclick = () => { state.deliveryInfo.paymentMethod = el.getAttribute('data-pay-method'); persistDeliveryPreferences(); render(); }; });
        document.querySelectorAll('[data-bill-chip]').forEach((el) => { el.onclick = () => { state.deliveryInfo.cashBillNote = el.getAttribute('data-bill-chip'); render(); }; });
        if (byId('input-cash-bill')) byId('input-cash-bill').oninput = (e) => { state.deliveryInfo.cashBillNote = e.target.value; refreshBubble(); };

        if (byId('btn-copy-pm')) byId('btn-copy-pm').onclick = async () => {
          const { totalUsd } = getCartTotals();
          const pmText = `${state.config.pagoMovilBank}\nCédula: ${state.config.pagoMovilDoc}\nTeléfono: ${state.config.pagoMovilPhone}\nMonto: ${formatBs(totalUsd, state.config.exchangeRateBsPerUsd)}`;
          if (navigator.clipboard) await navigator.clipboard.writeText(pmText);
          showToast('Datos de Pago Móvil copiados');
        };
        if (byId('btn-copy-invoice')) byId('btn-copy-invoice').onclick = async () => {
          if (navigator.clipboard) await navigator.clipboard.writeText(buildWhatsAppInvoice().text);
          showToast('Factura copiada');
        };
        if (byId('btn-view-loyalty-msg')) byId('btn-view-loyalty-msg').onclick = openLoyaltyRewardModal;
        if (byId('btn-send-whatsapp')) byId('btn-send-whatsapp').onclick = async () => {
          if (!state.deliveryInfo.address.trim()) { showToast('Ingresa tu dirección de entrega'); byId('input-address')?.focus(); return; }
          const { invoiceCode, text } = buildWhatsAppInvoice();
          const { totalUsd } = getCartTotals();
          const uid = (state.userProfile && state.userProfile.userId) || '';
          const storeNames = [...new Set(state.cart.map((c) => c.storeName))].join(' / ');
          const usedFreeReward = Boolean(state.userProfile && state.userProfile.hasFreeDeliveryReward);
          const intlPhone = toWhatsAppIntlPhone(state.config.whatsappPhone);

          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).catch(() => {});
            }
          } catch (_) {}

          openWhatsAppUrlSafely(intlPhone, text);
          showToast('Abriendo factura en WhatsApp...');

          const orderRecord = {
            id: 'ord_' + Date.now(),
            userId: uid,
            invoiceCode,
            createdAt: Date.now(),
            storeNames,
            items: state.cart,
            rate: state.config.exchangeRateBsPerUsd,
            totalUsd,
            freeDeliveryApplied: usedFreeReward,
            paymentMethod: state.deliveryInfo.paymentMethod === 'PAGO_MOVIL' ? 'Pago Móvil' : 'Divisa Efectivo',
            address: state.deliveryInfo.address.trim(),
            invoiceText: text
          };

          let unlockedSeventhNow = false;
          try {
            await ArismendiDB.saveOrder(orderRecord);
            state.orders.unshift(orderRecord);

            if (state.userProfile) {
              state.userProfile.totalOrders = Number(state.userProfile.totalOrders || 0) + 1;
              state.userProfile.totalSpentUsd = Number(state.userProfile.totalSpentUsd || 0) + totalUsd;
              state.userProfile.itemStats = state.userProfile.itemStats || {};
              state.cart.forEach((c) => {
                state.userProfile.itemStats[c.name] = Number(state.userProfile.itemStats[c.name] || 0) + Number(c.quantity || 1);
              });
              state.userProfile.savedDeliveryInfo = {
                customerName: state.deliveryInfo.customerName || '',
                address: state.deliveryInfo.address || '',
                reference: state.deliveryInfo.reference || '',
                paymentMethod: state.deliveryInfo.paymentMethod || 'PAGO_MOVIL'
              };

              if (usedFreeReward) {
                state.userProfile.hasFreeDeliveryReward = false;
                state.userProfile.loyaltyNotificationPending = false;
                state.userProfile.loyaltyDeliveriesCount = 0;
                state.userProfile.freeDeliveriesRedeemed = Number(state.userProfile.freeDeliveriesRedeemed || 0) + 1;
              } else {
                const nextCount = Number(state.userProfile.loyaltyDeliveriesCount || 0) + 1;
                if (nextCount >= 6) {
                  state.userProfile.loyaltyDeliveriesCount = 0;
                  state.userProfile.hasFreeDeliveryReward = true;
                  state.userProfile.loyaltyNotificationPending = true;
                  unlockedSeventhNow = true;
                } else {
                  state.userProfile.loyaltyDeliveriesCount = nextCount;
                }
              }
              await ArismendiDB.saveUserProfile(state.userProfile);
            }

            await recordActivity('order_sent', `${invoiceCode} • ${storeNames} • ${formatUsd(totalUsd)}${usedFreeReward ? ' (Delivery #7 Gratis)' : ''}`);
            if (usedFreeReward) {
              await recordActivity('loyalty_redeemed', `Canjeó su delivery número 7 gratis en ${invoiceCode}`);
            } else if (unlockedSeventhNow) {
              await recordActivity('loyalty_unlocked', 'Completó 6 pedidos: ¡Delivery #7 gratis activado!');
            }
          } catch (_) {}

          render();
          if (unlockedSeventhNow) {
            openLoyaltyRewardModal();
          }
        };

        document.querySelectorAll('[data-admin-tab]').forEach((el) => { el.onclick = () => { state.adminTab = el.getAttribute('data-admin-tab'); state.ghStatusBanner = null; window.scrollTo(0, 0); render(); }; });
        document.querySelectorAll('[data-rate-delta]').forEach((el) => { el.onclick = () => { const i = byId('cfg-rate'); i.value = Math.max(1, (parseFloat(i.value) || 1200) + parseFloat(el.getAttribute('data-rate-delta'))); }; });
        document.querySelectorAll('[data-rate-set]').forEach((el) => { el.onclick = () => { byId('cfg-rate').value = el.getAttribute('data-rate-set'); }; });

        const collectConfigInputs = async () => {
          if (!byId('cfg-rate')) return true;
          const rate = parseFloat(byId('cfg-rate').value);
          if (!rate || rate <= 0) { showToast('Tasa inválida'); return false; }
          state.config = {
            ...state.config,
            id: 'business_config',
            exchangeRateBsPerUsd: rate,
            pagoMovilBank: byId('cfg-bank').value.trim(),
            pagoMovilDoc: byId('cfg-doc').value.trim(),
            pagoMovilPhone: byId('cfg-pm-phone').value.trim(),
            whatsappPhone: byId('cfg-wa').value.trim() || '04245224500',
            deliveryFeeUsd: Math.max(0, parseFloat(byId('cfg-delivery').value) || 0)
          };
          await ArismendiDB.saveConfig(state.config);
          GitHubSync.markUnpushedChanges();
          return true;
        };

        const collectGitHubInputs = async () => {
          if (!byId('gh-owner')) return GitHubSync.getCreds();
          return GitHubSync.saveCreds({
            owner: byId('gh-owner').value,
            repo: byId('gh-repo').value,
            branch: byId('gh-branch').value,
            filePath: byId('gh-path').value,
            token: byId('gh-token').value
          });
        };

        if (byId('btn-save-config')) byId('btn-save-config').onclick = async () => {
          if (!(await collectConfigInputs())) return;
          showToast('Configuración local guardada');
          render();
        };

        if (byId('btn-toggle-gh-token') && byId('gh-token')) {
          byId('btn-toggle-gh-token').onclick = () => {
            const inp = byId('gh-token');
            inp.type = inp.type === 'password' ? 'text' : 'password';
          };
        }

        if (byId('btn-save-gh')) byId('btn-save-gh').onclick = async () => {
          const saved = await collectGitHubInputs();
          state.ghStatusBanner = { type: 'info', message: `Credenciales guardadas en este dispositivo (${saved.owner || 'sin usuario'}/${saved.repo || 'sin repo'}).` };
          showToast('Credenciales de GitHub guardadas');
          render();
        };

        if (byId('btn-test-gh')) byId('btn-test-gh').onclick = async () => {
          const creds = await collectGitHubInputs();
          state.isSyncingGitHub = true;
          state.ghStatusBanner = { type: 'info', message: 'Verificando conexión con GitHub...' };
          render();
          try {
            const info = await GitHubSync.testConnection(creds);
            state.ghStatusBanner = {
              type: 'ok',
              message: `Conexión exitosa con ${info.fullName} (rama ${info.branch}${info.isPrivate ? ', privado' : ', público'}). Listo para subir cambios.`
            };
            showToast('Conexión con GitHub exitosa');
          } catch (err) {
            state.ghStatusBanner = { type: 'err', message: err && err.message ? err.message : 'Error al conectar con GitHub' };
            showToast('Error al probar GitHub');
          } finally {
            state.isSyncingGitHub = false;
            render();
          }
        };

        const runPushToGitHub = async () => {
          if (state.adminTab === 'config') {
            if (!(await collectConfigInputs())) return;
          }
          const creds = await collectGitHubInputs();
          if (!creds.owner || !creds.repo || !creds.token) {
            state.adminTab = 'config';
            state.ghStatusBanner = { type: 'err', message: 'Completa tus credenciales de GitHub (Usuario, Repositorio y Token PAT) antes de subir los cambios.' };
            render();
            setTimeout(() => {
              const card = document.getElementById('gh-config-card');
              if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
            return;
          }
          state.isSyncingGitHub = true;
          state.ghStatusBanner = { type: 'info', message: 'Subiendo locales, menú, precios y tasa del día a GitHub...' };
          render();
          try {
            const res = await GitHubSync.pushCatalog(creds);
            state.ghStatusBanner = {
              type: 'ok',
              message: `✅ ¡Cambios subidos al repositorio! Commit ${res.commitSha || 'creado'}. Los clientes recibirán la actualización en segundos.`
            };
            showToast('Cambios publicados en GitHub');
          } catch (err) {
            state.ghStatusBanner = { type: 'err', message: err && err.message ? err.message : 'No se pudieron subir los cambios' };
            showToast('Error al subir a GitHub');
          } finally {
            state.isSyncingGitHub = false;
            render();
          }
        };

        if (byId('btn-push-gh')) byId('btn-push-gh').onclick = runPushToGitHub;
        if (byId('btn-push-gh-menu')) byId('btn-push-gh-menu').onclick = runPushToGitHub;

        if (byId('btn-pull-gh')) byId('btn-pull-gh').onclick = async () => {
          await collectGitHubInputs();
          state.isSyncingGitHub = true;
          state.ghStatusBanner = { type: 'info', message: 'Descargando catálogo desde GitHub...' };
          render();
          try {
            const ok = await GitHubSync.pullRemoteCatalog(true);
            state.ghStatusBanner = ok
              ? { type: 'ok', message: '⬇️ Catálogo, locales, menú y tasa actualizados desde GitHub.' }
              : { type: 'info', message: 'No hubo cambios nuevos por aplicar.' };
            showToast(ok ? 'Catálogo actualizado desde GitHub' : 'Sin cambios nuevos');
          } catch (err) {
            state.ghStatusBanner = { type: 'err', message: err && err.message ? err.message : 'No se pudo descargar desde GitHub' };
            showToast('Error al descargar de GitHub');
          } finally {
            state.isSyncingGitHub = false;
            render();
          }
        };

        if (byId('btn-export-db')) byId('btn-export-db').onclick = async () => {
          const json = await ArismendiDB.exportBackup();
          const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
          const a = document.createElement('a'); a.href = url; a.download = `arismendi-respaldo-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(url);
          showToast('Respaldo descargado');
        };
        if (byId('btn-import-db') && byId('input-import-db')) {
          byId('btn-import-db').onclick = () => byId('input-import-db').click();
          byId('input-import-db').onchange = async () => {
            const f = byId('input-import-db').files && byId('input-import-db').files[0];
            if (!f) return;
            await ArismendiDB.importBackup(await f.text());
            Object.assign(state, await ArismendiDB.loadAllState());
            GitHubSync.markUnpushedChanges();
            showToast('Base de datos restaurada'); render();
          };
        }
        document.querySelectorAll('[data-admin-edit-item]').forEach((el) => { el.onclick = () => { const item = state.menuItems.find((x) => x.id === el.getAttribute('data-admin-edit-item')); if (item) openEditMenuItemModal(item, false); }; });
        document.querySelectorAll('[data-admin-delete-item]').forEach((el) => {
          el.onclick = () => {
            const item = state.menuItems.find((x) => x.id === el.getAttribute('data-admin-delete-item'));
            if (!item) return;
            openConfirmDeleteModal(
              'Eliminar producto',
              `¿Seguro que deseas eliminar "${item.name}" del menú?`,
              async () => {
                await ArismendiDB.deleteMenuItem(item.id);
                state.menuItems = state.menuItems.filter((x) => x.id !== item.id);
                state.cart = state.cart.filter((c) => c.menuItemId !== item.id);
                await ArismendiDB.replaceCart(state.cart);
                GitHubSync.markUnpushedChanges();
                showToast(`${item.name} eliminado`);
                render();
              }
            );
          };
        });
        document.querySelectorAll('[data-admin-delete-store]').forEach((el) => {
          el.onclick = () => {
            const storeId = el.getAttribute('data-admin-delete-store');
            const st = state.stores.find((s) => s.id === storeId);
            if (!st) return;
            const itemCount = state.menuItems.filter((i) => i.storeId === storeId).length;
            openConfirmDeleteModal(
              'Eliminar local',
              `¿Seguro que deseas eliminar "${st.name}"? También se eliminarán ${itemCount} ${itemCount === 1 ? 'producto' : 'productos'} asociados.`,
              async () => {
                await ArismendiDB.deleteStore(storeId);
                state.stores = state.stores.filter((s) => s.id !== storeId);
                state.menuItems = state.menuItems.filter((i) => i.storeId !== storeId);
                state.cart = state.cart.filter((c) => c.storeId !== storeId);
                await ArismendiDB.replaceCart(state.cart);
                if (state.selectedStoreId === storeId) {
                  state.selectedStoreId = state.stores[0] ? state.stores[0].id : '';
                }
                GitHubSync.markUnpushedChanges();
                showToast(`Local "${st.name}" eliminado`);
                render();
              }
            );
          };
        });
        document.querySelectorAll('[data-admin-add-item]').forEach((el) => { el.onclick = () => openEditMenuItemModal(el.getAttribute('data-admin-add-item'), true); });
        if (byId('btn-admin-new-store')) byId('btn-admin-new-store').onclick = openNewStoreModal;
        if (byId('btn-admin-reset-catalog')) byId('btn-admin-reset-catalog').onclick = async () => { await ArismendiDB.resetCatalogToDefault(); const l = await ArismendiDB.loadAllState(); state.stores = l.stores; state.menuItems = l.menuItems; GitHubSync.markUnpushedChanges(); showToast('Menú restaurado'); render(); };
        if (byId('btn-clear-orders')) byId('btn-clear-orders').onclick = async () => { await ArismendiDB.clearOrders(); state.orders = []; showToast('Historial limpiado'); render(); };
        if (byId('btn-clear-logs')) byId('btn-clear-logs').onclick = async () => { await ArismendiDB.clearUsageLogs(); state.usageLogs = []; showToast('Registro de uso limpiado'); render(); };
        if (byId('btn-preview-loyalty')) byId('btn-preview-loyalty').onclick = () => openLoyaltyRewardModal(true);
        document.querySelectorAll('[data-acc-toggle]').forEach((el) => {
          el.onclick = () => {
            const key = el.getAttribute('data-acc-toggle');
            const nextOpen = !state.expandedAccordions[key];
            state.expandedAccordions[key] = nextOpen;
            const card = el.closest('.acc-card');
            if (card) card.classList.toggle('open', nextOpen);
          };
        });
        document.querySelectorAll('[data-resend-order]').forEach((el) => {
          el.onclick = () => {
            const ord = state.orders.find((o) => o.id === el.getAttribute('data-resend-order'));
            if (ord) openWhatsAppUrlSafely(toWhatsAppIntlPhone(state.config.whatsappPhone), ord.invoiceText);
          };
        });
      }

      // Pantalla de bienvenida animada antes de iniciar la app
      let splashDismissed = false;
      let pendingLoyaltyAfterSplash = false;
      function dismissSplashScreen() {
        if (splashDismissed) return;
        splashDismissed = true;
        const splash = document.getElementById('splash-screen');
        const appRoot = document.getElementById('app');
        if (splash) {
          splash.classList.add('splash-hide');
          setTimeout(() => splash.remove(), 440);
        }
        if (appRoot) {
          appRoot.classList.remove('view-accordion-enter');
          void appRoot.offsetWidth;
          appRoot.classList.add('view-accordion-enter');
        }
        if (pendingLoyaltyAfterSplash) {
          pendingLoyaltyAfterSplash = false;
          setTimeout(() => openLoyaltyRewardModal(), 260);
        }
      }

      const splashEl = document.getElementById('splash-screen');
      if (splashEl) {
        splashEl.addEventListener('click', dismissSplashScreen);
      }
      setTimeout(dismissSplashScreen, 1950);

      // Render inmediato al instante + sincronización asíncrona con IndexedDB
      render();

      if ((location.protocol === 'http:' || location.protocol === 'https:') && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        state.deferredInstallPrompt = e;
        if (state.view === 'home') render();
      });

      ArismendiDB.loadAllState().then(async (loaded) => {
        state.config = loaded.config;
        state.stores = loaded.stores;
        state.menuItems = loaded.menuItems;
        state.cart = loaded.cart;
        state.orders = loaded.orders;
        state.userProfile = loaded.userProfile;
        state.usageLogs = loaded.usageLogs || [];

        if (!state.hasEditedDelivery && state.userProfile && state.userProfile.savedDeliveryInfo) {
          const saved = state.userProfile.savedDeliveryInfo;
          state.deliveryInfo.customerName = saved.customerName || '';
          state.deliveryInfo.address = saved.address || '';
          state.deliveryInfo.reference = saved.reference || '';
          if (saved.paymentMethod) state.deliveryInfo.paymentMethod = saved.paymentMethod;
        }
        if (state.userProfile) {
          if (state.userProfile.loyaltyDeliveriesCount === undefined) {
            const legacyTotal = Number(state.userProfile.totalOrders || 0);
            const mod = legacyTotal % 7;
            state.userProfile.loyaltyDeliveriesCount = mod === 6 ? 0 : mod;
            if (legacyTotal > 0 && mod === 6) {
              state.userProfile.hasFreeDeliveryReward = true;
              state.userProfile.loyaltyNotificationPending = true;
            }
          }
          state.userProfile.sessionCount = Number(state.userProfile.sessionCount || 0) + 1;
          state.userProfile.lastActiveAt = Date.now();
          await ArismendiDB.saveUserProfile(state.userProfile);
        }
        await recordActivity('app_open', 'Inicio de sesión en la aplicación');
        render();
        if (state.userProfile && state.userProfile.loyaltyNotificationPending) {
          if (splashDismissed) openLoyaltyRewardModal();
          else pendingLoyaltyAfterSplash = true;
        }
        GitHubSync.pullRemoteCatalog(false).then((updated) => {
          if (updated) render();
        }).catch(() => {});
      }).catch(() => {});
    })();
  </script>
</body>
</html>
