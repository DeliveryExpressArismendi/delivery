      function formatUsd(amount) {
        const num = Number(amount) || 0;
        return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatBs(amountUsd, rate) {
        const bs = (Number(amountUsd) || 0) * (Number(rate) || 1200);
        return 'Bs. ' + bs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatRate(rate) {
        const num = Number(rate) || 1200;
        return num.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Bs/$';
      }

      function toWhatsAppIntlPhone(rawPhone) {
        const digits = String(rawPhone || '').replace(/\D/g, '');
        if (digits.startsWith('58') && digits.length >= 11) return digits;
        if (digits.startsWith('0') && digits.length >= 10) return '58' + digits.slice(1);
        return digits || '584245224500';
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function sanitizeWebUrl(rawUrl) {
        const trimmed = String(rawUrl || '').trim();
        if (!trimmed) return '';
        if (/^(javascript|data|vbscript|file):/i.test(trimmed)) return '';
        let candidate = trimmed;
        if (!/^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(candidate)) {
          if (!candidate.includes('.') || /\s/.test(candidate)) return '';
          candidate = 'https://' + candidate.replace(/^\/+/, '');
        }
        try {
          const parsed = new URL(candidate);
          if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
          return parsed.href;
        } catch (_) {
          return '';
        }
      }

      function getShortLinkHost(cleanUrl) {
        try {
          const u = new URL(cleanUrl);
          const host = u.hostname.replace(/^www\./i, '');
          const pathPart = u.pathname && u.pathname !== '/' ? u.pathname.replace(/\/$/, '') : '';
          const full = host + (pathPart.length > 0 && pathPart.length <= 18 ? pathPart : '');
          return full.length > 30 ? full.slice(0, 29) + '…' : full;
        } catch (_) {
          return 'Ver enlace';
        }
      }

      function renderVisualMedia(iconKey, imageUrl, iconSize = 38, fallbackColor = '', altText = '') {
        const safeImg = sanitizeWebUrl(imageUrl);
        const svgFallback = getCategoryIcon(iconKey, fallbackColor, iconSize);
        if (!safeImg) return svgFallback;
        return `<img class="media-thumb-img" src="${escapeHtml(safeImg)}" alt="${escapeHtml(altText || 'Imagen')}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='flex'" /><span class="media-thumb-fallback" style="display:none">${svgFallback}</span>`;
      }

      function buildShareLink(paramKey, id) {
        const origin = (window.location.origin && window.location.origin !== 'null' && /^https?:/i.test(window.location.protocol))
          ? (window.location.origin + window.location.pathname)
          : 'https://deliveryexpressarismendi.github.io/delivery/';
        return `${origin}?${encodeURIComponent(paramKey)}=${encodeURIComponent(id)}`;
      }

      async function copyShareLink(paramKey, id, label) {
        const shareUrl = buildShareLink(paramKey, id);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(shareUrl);
            showToast(`🔗 Link de ${label} copiado`);
            return;
          }
        } catch (_) {}
        showToast(`Link: ${shareUrl}`);
      }

      function showToast(msg) {
        const root = document.getElementById('toast-root');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        root.appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }

      function getCartTotals() {
        const subtotalUsd = state.cart.reduce((sum, item) => sum + item.priceUsd * item.quantity, 0);
        const isFreeSeventhDelivery = Boolean(state.userProfile && state.userProfile.hasFreeDeliveryReward);
        const deliveryUsd = state.cart.length > 0
          ? (isFreeSeventhDelivery ? 0 : Number(state.config.deliveryFeeUsd || 0))
          : 0;
        const totalUsd = subtotalUsd + deliveryUsd;
        const count = state.cart.reduce((sum, item) => sum + item.quantity, 0);
        return { subtotalUsd, deliveryUsd, totalUsd, count, isFreeSeventhDelivery };
      }

      function buildWhatsAppInvoice(invoiceCode = `DEA-${Math.floor(1000 + Math.random() * 9000)}`) {
        const rate = Number(state.config.exchangeRateBsPerUsd) || 1200;
        const { subtotalUsd, deliveryUsd, totalUsd, isFreeSeventhDelivery } = getCartTotals();
        const storeNames = [...new Set(state.cart.map((c) => c.storeName))].join(' / ');
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-VE') + ' ' + now.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' });

        const lines = [
          '🛵 *DELIVERY EXPRESS ARISMENDI*',
          '━━━━━━━━━━━━━━━━━━━━━━',
          `🧾 *Factura N°:* ${invoiceCode}`,
          `📅 *Fecha:* ${dateStr}`
        ];
        if (storeNames) lines.push(`🍔 *Local:* ${storeNames}`);
        lines.push('', '*DETALLE DEL PEDIDO:*');

        state.cart.forEach((item, idx) => {
          const lineUsd = formatUsd(item.priceUsd * item.quantity);
          const lineBs = formatBs(item.priceUsd * item.quantity, rate);
          lines.push(`${idx + 1}. *${item.quantity}x ${item.name}*`);
          lines.push(`   💵 ${lineUsd}  |  🇻🇪 ${lineBs}`);
          if (item.selectedIngredients && item.selectedIngredients.length) {
            lines.push(`   🧂 _Ingredientes:_ ${item.selectedIngredients.join(', ')}`);
          }
          const excluded = (item.allIngredients || []).filter((ing) => !(item.selectedIngredients || []).includes(ing));
          if (excluded.length) lines.push(`   🚫 _Sin:_ ${excluded.join(', ')}`);
          if (item.note && item.note.trim()) lines.push(`   📝 _Nota:_ ${item.note.trim()}`);
        });

        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push(`📦 *Subtotal:* ${formatUsd(subtotalUsd)} (${formatBs(subtotalUsd, rate)})`);
        lines.push(
          isFreeSeventhDelivery
            ? '🛵 *Delivery:* GRATIS 🎁 (Premio Fidelidad - Entrega #7)'
            : (deliveryUsd > 0
              ? `🛵 *Delivery:* ${formatUsd(deliveryUsd)} (${formatBs(deliveryUsd, rate)})`
              : '🛵 *Delivery:* Por confirmar / Gratis')
        );
        lines.push(`💱 *Tasa del día:* ${formatRate(rate)}`);
        lines.push('');
        lines.push(`💰 *TOTAL EN DIVISAS:* ${formatUsd(totalUsd)}`);
        lines.push(`🇻🇪 *TOTAL EN BOLÍVARES:* ${formatBs(totalUsd, rate)}`);
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push('*MÉTODO DE PAGO:*');

        if (state.deliveryInfo.paymentMethod === 'PAGO_MOVIL') {
          lines.push('📲 *Pago Móvil (Bolívares)*');
          lines.push(`• Banco: ${state.config.pagoMovilBank}`);
          lines.push(`• Cédula/RIF: ${state.config.pagoMovilDoc}`);
          lines.push(`• Teléfono: ${state.config.pagoMovilPhone}`);
          lines.push(`• Monto exacto: *${formatBs(totalUsd, rate)}*`);
        } else {
          lines.push('💵 *Divisa en Efectivo (Dólares)*');
          lines.push(`• Monto exacto: *${formatUsd(totalUsd)}*`);
          if (state.deliveryInfo.cashBillNote.trim()) {
            lines.push(`• Paga con billete de: ${state.deliveryInfo.cashBillNote.trim()}`);
          }
        }

        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push('📍 *DATOS DE ENTREGA:*');
        if (state.deliveryInfo.customerName.trim()) lines.push(`• Cliente: ${state.deliveryInfo.customerName.trim()}`);
        lines.push(`• Dirección: ${state.deliveryInfo.address.trim()}`);
        if (state.deliveryInfo.reference.trim()) lines.push(`• Referencia: ${state.deliveryInfo.reference.trim()}`);
        lines.push('', '¡Gracias por pedir con *Delivery Express Arismendi*! 🚀');

        return { invoiceCode, text: lines.join('\n') };
      }

      function isIosSafari() {
        const ua = window.navigator.userAgent || '';
        const isIos = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        return isIos && !isStandalone;
      }

      function isStandalonePwa() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      }

      function renderInstallBanner() {
        if (isStandalonePwa()) return '';
        if (state.deferredInstallPrompt) {
          return `
            <div class="install-banner">
              <div class="install-banner-text">
                <strong>Instala Delivery Express Arismendi</strong>
                Úsala como app en tu Android sin ocupar memoria.
              </div>
              <button class="btn-install" id="btn-pwa-install">Instalar App</button>
            </div>`;
        }
        if (isIosSafari()) {
          return `
            <div class="install-banner">
              <div class="install-banner-text">
                <strong>Instalar en iPhone</strong>
                Toca <b>Compartir</b> y elige <b>"Añadir a pantalla de inicio"</b>.
              </div>
              <button class="btn-install" id="btn-ios-guide">Ver pasos</button>
            </div>`;
        }
        return '';
      }

      function render() {
        const root = document.getElementById('app');
        const routeKey = `${state.view}|${state.adminTab}|${state.selectedStoreId}|${state.selectedCategory}`;
        const shouldAnimate = routeKey !== state.lastRouteKey;
        state.lastRouteKey = routeKey;

        if (state.view === 'home') root.innerHTML = renderHomeView();
        else if (state.view === 'store') root.innerHTML = renderStoreView();
        else if (state.view === 'checkout') root.innerHTML = renderCheckoutView();
        else if (state.view === 'admin') root.innerHTML = renderAdminView();

        if (shouldAnimate) {
          root.classList.remove('view-accordion-enter');
          void root.offsetWidth;
          root.classList.add('view-accordion-enter');
        } else {
          root.classList.remove('view-accordion-enter');
        }
        bindEvents();
      }

      function renderFloatingCartBar() {
        if (state.view === 'checkout' || state.view === 'admin') return '';
        const { count, totalUsd } = getCartTotals();
        if (count === 0) return '';
        const rate = state.config.exchangeRateBsPerUsd;
        return `
          <div class="floating-cart-wrap">
            <button class="floating-cart-btn" id="btn-open-checkout">
              <div style="text-align:left">
                <div style="font-size:14.5px;font-weight:800">${count} ${count === 1 ? 'producto' : 'productos'} • Ver Factura</div>
                <div style="font-size:12px;opacity:0.92">${formatBs(totalUsd, rate)}</div>
              </div>
              <span class="cart-badge-usd">${formatUsd(totalUsd)}</span>
            </button>
          </div>`;
      }

      function isItemAvailable(item) {
        if (!item) return false;
        if (item.available === false) return false;
        if (item.stock !== null && item.stock !== undefined && item.stock !== '' && Number(item.stock) <= 0) return false;
        return true;
      }

      function getItemStockLabel(item) {
        if (!isItemAvailable(item)) return 'Agotado';
        if (item.stock !== null && item.stock !== undefined && item.stock !== '') {
          return `Stock: ${Number(item.stock)}`;
        }
        return 'Disponible';
      }

      function renderHomeView() {
        const rate = state.config.exchangeRateBsPerUsd;
        const { count } = getCartTotals();
        const popularItems = state.menuItems
          .filter((i) => i.isPopular && state.stores.some((s) => s.id === i.storeId))
          .slice(0, 5);
        const fallbackFeatured = popularItems.length
          ? popularItems
          : state.menuItems.filter((i) => state.stores.some((s) => s.id === i.storeId)).slice(0, 5);

        const storesHtml = state.stores.map((st) => {
          const storeItems = state.menuItems.filter((i) => i.storeId === st.id);
          const minUsd = storeItems.length ? Math.min(...storeItems.map((i) => i.priceUsd)) : 0;
          const isStoreOpen = st.isOpen !== false;
          const safeStoreWeb = sanitizeWebUrl(st.webUrl);
          return `
            <div class="store-card" data-open-store="${escapeHtml(st.id)}" style="${isStoreOpen ? '' : 'opacity:0.75'}">
              <div class="store-card-banner">
                <div style="min-width:0">
                  <span class="store-badge">${escapeHtml(isStoreOpen ? (st.badge || 'Comida Rápida') : '🔴 Cerrado temporalmente')}</span>
                  <h3 class="store-name">${escapeHtml(st.name)}</h3>
                  <div class="store-meta">${escapeHtml(st.etaMinutes || '20-30 min')} • ${storeItems.length} productos • ★ ${escapeHtml(st.rating || '4.9')}</div>
                </div>
                <div class="store-icon-box">${renderVisualMedia(st.iconKey, st.imageUrl, 44, '', st.name)}</div>
              </div>
              <div class="store-card-footer">
                <div style="min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px">
                  <div class="store-tagline">${escapeHtml(st.tagline)}</div>
                  ${safeStoreWeb ? `<a class="web-link-pill web-link-pill--card" href="${escapeHtml(safeStoreWeb)}" target="_blank" rel="noopener noreferrer" data-stop-card>🌐 ${escapeHtml(getShortLinkHost(safeStoreWeb))} ↗</a>` : ''}
                </div>
                <div class="dual-price">
                  <span class="price-usd">Desde ${formatUsd(minUsd)}</span>
                  <span class="price-bs">${formatBs(minUsd, rate)}</span>
                </div>
              </div>
            </div>`;
        }).join('');

        const highlightsHtml = fallbackFeatured.map((item) => {
          const avail = isItemAvailable(item);
          const safeItemWeb = sanitizeWebUrl(item.webUrl);
          return `
          <div class="quick-card" data-customize-item="${escapeHtml(item.id)}" style="${avail ? '' : 'opacity:0.65'}">
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:6px">
                <span class="cat-kicker">${escapeHtml(avail ? item.category : 'Agotado')}</span>
                <div class="quick-media-box">${renderVisualMedia(item.iconKey, item.imageUrl, 28, '', item.name)}</div>
              </div>
              <div style="font-weight:800;font-size:15px">${escapeHtml(item.name)}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${escapeHtml((item.ingredients || []).slice(0, 4).join(', '))}</div>
              ${safeItemWeb ? `<div style="margin-top:6px"><a class="web-link-pill web-link-pill--soft" href="${escapeHtml(safeItemWeb)}" target="_blank" rel="noopener noreferrer" data-stop-card>🔗 ${escapeHtml(getShortLinkHost(safeItemWeb))} ↗</a></div>` : ''}
            </div>
            <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:6px">
              <div class="dual-price" style="text-align:left">
                <span class="price-usd" style="font-size:16px">${formatUsd(item.priceUsd)}</span>
                <span class="price-bs">${formatBs(item.priceUsd, rate)}</span>
              </div>
              <button class="btn-primary" style="flex:0;min-height:38px;padding:0 12px" data-quick-add="${escapeHtml(item.id)}" ${avail ? '' : 'disabled'}>${avail ? '+' : 'Agotado'}</button>
            </div>
          </div>`;
        }).join('');

        return `
          <header class="hero-header">
            <div class="hero-top-row">
              <div class="brand-group">
                <div class="brand-moto-badge"><img src="icons/logo.png" alt="Logo Delivery Express Arismendi" class="brand-logo-img" /></div>
                <div>
                  <span class="brand-title-sub">Delivery Express</span>
                  <h1 class="brand-title-main">ARISMENDI</h1>
                </div>
              </div>
              <div class="header-actions">
                ${count > 0 ? `<button class="icon-btn" id="btn-header-checkout" aria-label="Ver factura">${SVG_ICONS.receipt(20)}</button>` : ''}
                <button class="icon-btn" id="btn-open-admin" aria-label="Ajustes de administrador">${SVG_ICONS.gear(20)}</button>
              </div>
            </div>
            <div class="hero-pills-row">
              <button class="rate-pill" id="btn-quick-rate">💱 Tasa: ${formatRate(rate)}${state.isAdminUnlocked ? ' ✎' : ''}</button>
              <span class="wa-badge-pill">WhatsApp: ${escapeHtml(state.config.whatsappPhone)}</span>
              <button class="wa-badge-pill" id="btn-live-sync" style="cursor:pointer;border:1px solid rgba(255,255,255,0.28)" title="Sincronizar cambios desde GitHub">🟢 ${escapeHtml(GitHubSync.getCreds().lastRemoteReleaseTag || 'En vivo')} ↻</button>
            </div>
            <p class="hero-desc">Comida rápida directo a tu puerta con factura en Bolívares y Dólares a la tasa del día. Sin registros obligatorios.</p>
          </header>
          ${renderInstallBanner()}
          ${state.userProfile && state.userProfile.hasFreeDeliveryReward ? `
            <div class="loyalty-banner">
              <div style="font-size:13px;color:#5D3A00">
                <strong style="display:block;font-size:14px;color:#8D5800">🎉 ¡Tienes tu Delivery #7 GRATIS!</strong>
                Disfruta de tu próxima entrega por nuestra cuenta.
              </div>
              <button class="btn-install" id="btn-view-loyalty-msg">Ver premio</button>
            </div>` : ''}
          <div class="section-head">
            <h2 class="section-title">🍔 Locales de Comida Rápida</h2>
            <p class="section-subtitle">Escoge tu local favorito y personaliza los ingredientes</p>
          </div>
          <div class="stack-list">${storesHtml || `
            <div class="empty-state" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 18px">
              <div style="font-size:28px">${navigator.onLine === false || !GitHubSync.hasEverSynced() ? '📡' : '🏪'}</div>
              <div style="font-weight:800;font-size:15px;color:var(--text-main)">${navigator.onLine === false || !GitHubSync.hasEverSynced() ? 'Sin conexión con la nube' : 'No hay locales disponibles'}</div>
              <div style="font-size:13px;color:var(--text-muted);line-height:1.45">${navigator.onLine === false || !GitHubSync.hasEverSynced() ? 'Conéctate a internet para descargar automáticamente los locales, precios, inventario y la tasa del día desde GitHub.' : 'Puedes actualizar desde la nube o crear un local nuevo en Modo Administrador.'}</div>
              <button class="btn-primary" id="btn-retry-cloud" style="max-width:260px">🔄 Reintentar desde GitHub</button>
            </div>`}</div>
          ${fallbackFeatured.length ? `
            <div class="section-head" style="display:flex;justify-content:space-between;align-items:center">
              <h2 class="section-title" style="font-size:17px">🔥 Destacados del Día</h2>
              ${fallbackFeatured[0] ? `<button class="chip" style="padding:5px 11px;font-size:12px" data-open-store="${escapeHtml(fallbackFeatured[0].storeId)}">Ver local</button>` : ''}
            </div>
            <div class="h-scroll">${highlightsHtml}</div>` : ''}
          ${renderFloatingCartBar()}`;
      }

      function renderStoreView() {
        const store = state.stores.find((s) => s.id === state.selectedStoreId) || state.stores[0];
        if (!store) return renderHomeView();
        const rate = state.config.exchangeRateBsPerUsd;
        const allItems = state.menuItems.filter((i) => i.storeId === store.id);
        const categories = ['Todos', ...new Set(allItems.map((i) => i.category))];
        const filtered = state.selectedCategory === 'Todos' ? allItems : allItems.filter((i) => i.category === state.selectedCategory);

        const chipsHtml = categories.map((cat) =>
          `<button class="chip ${cat === state.selectedCategory ? 'active' : ''}" data-select-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
        ).join('');

        const isStoreOpen = store.isOpen !== false;
        const safeStoreWeb = sanitizeWebUrl(store.webUrl);
        const itemsHtml = filtered.map((item) => {
          const avail = isStoreOpen && isItemAvailable(item);
          const hasFiniteStock = item.stock !== null && item.stock !== undefined && item.stock !== '';
          const stockNum = hasFiniteStock ? Number(item.stock) : null;
          const safeItemWeb = sanitizeWebUrl(item.webUrl);
          const safeItemImg = sanitizeWebUrl(item.imageUrl);
          return `
          <div class="menu-card" data-customize-item="${escapeHtml(item.id)}" style="${avail ? '' : 'opacity:0.65'}">
            <div class="menu-card-top">
              <div style="display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0">
                <div class="menu-item-icon clickable-media" data-zoom-item="${escapeHtml(item.id)}" role="button" tabindex="0" aria-label="Ver imagen ampliada de ${escapeHtml(item.name)}" title="Toca para ampliar imagen">${renderVisualMedia(item.iconKey, item.imageUrl, 42, '', item.name)}${safeItemImg ? '<span class="zoom-badge" aria-hidden="true">🔍</span>' : ''}</div>
                <div style="min-width:0">
                  <div>
                    <span class="cat-kicker">${escapeHtml(item.category)}</span>
                    ${item.isPopular ? '<span class="popular-tag">Top</span>' : ''}
                    ${!isItemAvailable(item) ? '<span class="popular-tag" style="background:#FFEBEE;color:#B00020">Agotado</span>' : (hasFiniteStock && stockNum <= 5 ? `<span class="popular-tag" style="background:#FFF8E1;color:#8D5800">Quedan ${stockNum}</span>` : '')}
                  </div>
                  <h3 class="menu-item-title">${escapeHtml(item.name)}</h3>
                </div>
              </div>
              <div class="dual-price">
                <span class="price-usd">${formatUsd(item.priceUsd)}</span>
                <span class="price-bs">${formatBs(item.priceUsd, rate)}</span>
              </div>
            </div>
            ${item.description ? `<p class="menu-item-desc">${escapeHtml(item.description)}</p>` : ''}
            ${safeItemWeb ? `<div><a class="web-link-pill web-link-pill--card" href="${escapeHtml(safeItemWeb)}" target="_blank" rel="noopener noreferrer" data-stop-card>🔗 ${escapeHtml(getShortLinkHost(safeItemWeb))} ↗</a></div>` : ''}
            ${(item.ingredients && item.ingredients.length) ? `<div class="ingredients-box"><strong>Opciones / Ingredientes:</strong> ${escapeHtml(item.ingredients.join(' • '))}</div>` : ''}
            <div class="card-btn-row">
              <button class="btn-outline" data-customize-item="${escapeHtml(item.id)}">${(item.ingredients && item.ingredients.length) ? 'Personalizar' : 'Ver detalle'}</button>
              <button class="btn-primary" data-quick-add="${escapeHtml(item.id)}" ${avail ? '' : 'disabled'}>${isStoreOpen ? (isItemAvailable(item) ? '+ Agregar' : 'Agotado') : 'Local cerrado'}</button>
            </div>
          </div>`;
        }).join('');

        return `
          <div class="sub-topbar">
            <div class="sub-topbar-left">
              <button class="icon-btn" id="btn-back-home" aria-label="Volver">${SVG_ICONS.back(20)}</button>
              <div>
                <div style="font-size:17.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(store.name)}</div>
                <div style="font-size:12px;opacity:0.9">${escapeHtml(store.etaMinutes)} • ★ ${escapeHtml(store.rating)}${isStoreOpen ? '' : ' • Cerrado'}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
              <button class="icon-btn" id="btn-share-store" style="width:38px;height:38px;font-size:15px" aria-label="Copiar link del local" title="Copiar link directo de este local">🔗</button>
              <button class="rate-pill" id="btn-quick-rate" style="font-size:12px;padding:6px 10px">${formatRate(rate)}</button>
            </div>
          </div>
          ${!isStoreOpen ? '<div class="error-banner" style="margin:12px 16px 0">🔴 Este local está cerrado temporalmente. Revisa otro local o vuelve más tarde.</div>' : ''}
          ${safeStoreWeb ? `
            <a class="store-web-strip" href="${escapeHtml(safeStoreWeb)}" target="_blank" rel="noopener noreferrer">
              <span>🌐 Link web del local: <u style="text-underline-offset:2px">${escapeHtml(getShortLinkHost(safeStoreWeb))}</u></span>
              <span style="font-size:13px">Abrir ↗</span>
            </a>` : ''}
          <div class="chips-row">${chipsHtml}</div>
          <div class="stack-list">${itemsHtml || '<div class="empty-state">No hay productos en esta categoría.</div>'}</div>
          ${renderFloatingCartBar()}`;
      }

      function renderCheckoutView() {
        const rate = state.config.exchangeRateBsPerUsd;
        const { subtotalUsd, deliveryUsd, totalUsd, isFreeSeventhDelivery } = getCartTotals();

        if (state.cart.length === 0) {
          return `
            <div class="sub-topbar">
              <div class="sub-topbar-left">
                <button class="icon-btn" id="btn-back-from-checkout" aria-label="Volver">${SVG_ICONS.back(20)}</button>
                <div style="font-size:18px;font-weight:800">Factura y Envío</div>
              </div>
            </div>
            <div class="empty-state">
              <div style="margin-bottom:12px"><img src="icons/logo.png" alt="Delivery Express Arismendi" style="width:68px;height:68px;border-radius:18px;box-shadow:0 6px 16px rgba(211,47,47,0.24)" /></div>
              <h3 style="margin:0 0 6px;color:var(--text-main)">Tu pedido está vacío</h3>
              <p style="margin:0 0 16px">Escoge tu local favorito y agrega tus productos para generar la factura por WhatsApp.</p>
              <button class="btn-primary" id="btn-empty-go-home" style="max-width:220px;margin:0 auto">Explorar Locales</button>
            </div>`;
        }

        const { text: invoicePreview } = buildWhatsAppInvoice('DEA-PREVIEW');
        const cartRows = state.cart.map((item) => {
          const excluded = (item.allIngredients || []).filter((i) => !(item.selectedIngredients || []).includes(i));
          return `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--outline)">
              <div style="flex:1">
                <div style="font-weight:800;font-size:14.5px">${escapeHtml(item.name)}</div>
                <div style="font-size:11.5px;color:var(--crimson-primary);font-weight:700">${escapeHtml(item.storeName)}</div>
                ${excluded.length ? `<div style="font-size:11.5px;color:#B00020">Sin: ${escapeHtml(excluded.join(', '))}</div>` : ''}
                ${item.note ? `<div style="font-size:11.5px;color:var(--text-muted)">Nota: ${escapeHtml(item.note)}</div>` : ''}
                <div style="font-size:13px;font-weight:700;margin-top:3px">${formatUsd(item.priceUsd * item.quantity)} • ${formatBs(item.priceUsd * item.quantity, rate)}</div>
              </div>
              <div class="qty-stepper">
                <button class="qty-btn" data-cart-dec="${escapeHtml(item.cartItemId)}">−</button>
                <strong style="min-width:18px;text-align:center">${item.quantity}</strong>
                <button class="qty-btn" data-cart-inc="${escapeHtml(item.cartItemId)}">+</button>
              </div>
            </div>`;
        }).join('');

        const isPagoMovil = state.deliveryInfo.paymentMethod === 'PAGO_MOVIL';

        return `
          <div class="sub-topbar">
            <div class="sub-topbar-left">
              <button class="icon-btn" id="btn-back-from-checkout" aria-label="Volver">${SVG_ICONS.back(20)}</button>
              <div>
                <div style="font-size:18px;font-weight:800">Factura y Envío</div>
                <div style="font-size:12px;opacity:0.9">Tasa: ${formatRate(rate)}</div>
              </div>
            </div>
            <button class="rate-pill" id="btn-clear-cart" style="font-size:12px;padding:6px 10px">Vaciar</button>
          </div>

          <div class="stack-list" style="padding-top:14px">
            <div class="panel-card">
              <h3 class="panel-card-title">🛒 Resumen del Pedido</h3>
              ${cartRows}
              <div style="display:flex;justify-content:space-between;font-size:13.5px">
                <span>Subtotal</span>
                <strong>${formatUsd(subtotalUsd)} • ${formatBs(subtotalUsd, rate)}</strong>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:13.5px">
                <span>Delivery</span>
                <strong style="color:${isFreeSeventhDelivery ? '#1B8E3E' : 'var(--crimson-primary)'}">
                  ${isFreeSeventhDelivery ? 'GRATIS 🎁 (Fidelidad #7)' : (deliveryUsd > 0 ? `${formatUsd(deliveryUsd)} • ${formatBs(deliveryUsd, rate)}` : 'Por confirmar / Gratis')}
                </strong>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--outline)">
                <div>
                  <div style="font-size:12px;color:var(--text-muted)">TOTAL DIVISAS</div>
                  <div style="font-size:22px;font-weight:900;color:var(--crimson-primary)">${formatUsd(totalUsd)}</div>
                </div>
                <div style="text-align:right">
                  <div style="font-size:12px;color:var(--text-muted)">TOTAL BOLÍVARES</div>
                  <div style="font-size:18px;font-weight:900">${formatBs(totalUsd, rate)}</div>
                </div>
              </div>
            </div>

            <div class="panel-card">
              <h3 class="panel-card-title">📍 Dirección y Referencia de Entrega</h3>
              <div class="field-group">
                <label class="field-label" for="input-address">Dirección exacta *</label>
                <textarea id="input-address" class="input textarea" placeholder="Ej: Urb. Los Pinos, Calle 4, Casa #12">${escapeHtml(state.deliveryInfo.address)}</textarea>
              </div>
              <div class="field-group">
                <label class="field-label" for="input-ref">Punto de referencia (opcional)</label>
                <input id="input-ref" class="input" type="text" placeholder="Ej: Portón rojo frente a la panadería" value="${escapeHtml(state.deliveryInfo.reference)}" />
              </div>
              <div class="field-group">
                <label class="field-label" for="input-name">Nombre / Quién recibe (opcional)</label>
                <input id="input-name" class="input" type="text" placeholder="Ej: Carlos Pérez" value="${escapeHtml(state.deliveryInfo.customerName)}" />
              </div>
            </div>

            <div class="panel-card">
              <h3 class="panel-card-title">💳 Método de Pago</h3>
              <div class="payment-option ${isPagoMovil ? 'selected' : ''}" data-pay-method="PAGO_MOVIL">
                <div>
                  <div style="font-weight:800;font-size:14.5px">Pago Móvil (Bolívares)</div>
                  <div style="font-size:12px;color:var(--text-muted)">Calculado a ${formatRate(rate)}</div>
                </div>
                <strong style="color:var(--crimson-deep)">${formatBs(totalUsd, rate)}</strong>
              </div>
              ${isPagoMovil ? `
                <div class="pago-movil-box">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <strong style="color:var(--crimson-deep)">Datos de Pago Móvil</strong>
                    <button class="chip" id="btn-copy-pm" style="padding:4px 10px;font-size:11.5px">Copiar datos</button>
                  </div>
                  <div><b>Banco:</b> ${escapeHtml(state.config.pagoMovilBank)}</div>
                  <div><b>Cédula / RIF:</b> ${escapeHtml(state.config.pagoMovilDoc)}</div>
                  <div><b>Teléfono:</b> ${escapeHtml(state.config.pagoMovilPhone)}</div>
                  <div style="color:var(--crimson-deep);font-weight:800">Monto exacto: ${formatBs(totalUsd, rate)}</div>
                </div>` : ''}

              <div class="payment-option ${!isPagoMovil ? 'selected' : ''}" data-pay-method="EFECTIVO_USD">

        root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="bottom-sheet">${html}</div></div>`;

        if (sheet) sheet.scrollTop = 0;
        document.getElementById('modal-backdrop').addEventListener('click', (e) => {

        });
        if (bindFn) bindFn(closeModal);
      }

        document.body.style.overflow = '';

          try {
            if ('Notification' in window && Notification.permission === 'granted') {
              new Notification('Delivery Express Arismendi', {
                body: LOYALTY_REWARD_MESSAGE,
                icon: 'icons/icon-192.png'
              });

      function openAdminAuthModal(onUnlocked) {
        openModal(`
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 style="margin:0">🔐 Acceso Administrador</h3>
            <button class="chip" id="m-close">✕</button>
          </div>
          <p style="margin:0;font-size:13px;color:var(--text-muted)">Los ajustes y la tasa del día están protegidos. Ingresa la clave de administrador para continuar.</p>
          <div class="field-group">
            <label class="field-label" for="admin-pw-input">Clave de acceso</label>
            <div class="pw-input-wrap">
              <input id="admin-pw-input" class="input" type="password" placeholder="Ingresa la clave" autocomplete="off" />
              <button type="button" class="pw-toggle-btn" id="btn-toggle-pw" aria-label="Mostrar u ocultar clave">👁️</button>
            </div>
          </div>
          <div id="admin-pw-error" class="error-banner" style="display:none">Clave incorrecta. Intenta nuevamente.</div>
          <div class="card-btn-row">
            <button class="btn-outline" id="m-pw-cancel">Cancelar</button>
            <button class="btn-primary" id="m-pw-submit">Desbloquear</button>
          </div>`,
          (close) => {
            const input = document.getElementById('admin-pw-input');
            const errBox = document.getElementById('admin-pw-error');
            const toggleBtn = document.getElementById('btn-toggle-pw');
            setTimeout(() => input.focus(), 60);
            document.getElementById('m-close').onclick = close;
            document.getElementById('m-pw-cancel').onclick = close;
            toggleBtn.onclick = () => {
              input.type = input.type === 'password' ? 'text' : 'password';
            };
            const tryUnlock = () => {
              if (verifyAdminPassword(input.value)) {
                state.isAdminUnlocked = true;
                close();
                showToast('Modo administrador desbloqueado');
                if (onUnlocked) onUnlocked();
              } else {
                errBox.style.display = 'block';
                input.value = '';
                input.focus();
              }
            };
            document.getElementById('m-pw-submit').onclick = tryUnlock;
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
          }
        );
      }

      function requestAdminAccess(onUnlocked) {
        if (state.isAdminUnlocked) {
          onUnlocked();
        } else {
          openAdminAuthModal(onUnlocked);
        }
      }

      function openQuickRateModal() {
        if (!state.isAdminUnlocked) {
          return openAdminAuthModal(openQuickRateModal);
        }
        const current = state.config.exchangeRateBsPerUsd;
        openModal(`
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 style="margin:0">💱 Tasa del Día (Bs/$)</h3>
            <button class="chip" id="m-close">✕</button>
          </div>
          <p style="margin:0;font-size:13px;color:var(--text-muted)">Cambia la tasa para recalcular todos los precios en bolívares automáticamente.</p>
          <input id="m-rate-input" class="input" type="number" step="0.01" value="${current}" />
          <div id="m-rate-preview" style="font-size:13px;font-weight:700;color:var(--crimson-primary)">Ejemplo: $5.00 = ${formatBs(5, current)}</div>
          <div class="card-btn-row">
            <button class="btn-outline" id="m-open-admin">Config. Completa</button>
            <button class="btn-primary" id="m-save-rate">Guardar Tasa</button>
          </div>`,
          (close) => {
            const input = document.getElementById('m-rate-input');
            const preview = document.getElementById('m-rate-preview');
            input.addEventListener('input', () => {
              const val = parseFloat(input.value);
              preview.textContent = val > 0 ? `Ejemplo: $5.00 = ${formatBs(5, val)}` : 'Ingresa un monto válido';
            });
            document.getElementById('m-close').onclick = close;
            document.getElementById('m-open-admin').onclick = () => { close(); state.view = 'admin'; state.adminTab = 'config'; render(); };
            document.getElementById('m-save-rate').onclick = async () => {
              const val = parseFloat(input.value);
              if (!val || val <= 0) return showToast('Tasa inválida');
              state.config.exchangeRateBsPerUsd = val;
              await ArismendiDB.saveConfig(state.config);
              close();
              showToast(`Tasa actualizada a ${formatRate(val)}`);
              render();
              GitHubSync.triggerAutoCloudPush('Tasa del día');
            };
          }
        );
      }

      function closeProductImageViewer() {
        const lbRoot = document.getElementById('lightbox-root');
        if (lbRoot) lbRoot.innerHTML = '';
        if (!document.getElementById('modal-root')?.innerHTML.trim() && !document.getElementById('gate-root')?.innerHTML.trim()) {
          document.body.style.overflow = '';
        }
      }

      function openProductImageViewer(item, fromCustomizerModal = false) {
        const lbRoot = document.getElementById('lightbox-root');
        if (!lbRoot || !item) return;
        const rate = state.config.exchangeRateBsPerUsd;
        const store = state.stores.find((s) => s.id === item.storeId);
        const canOrder = (!store || store.isOpen !== false) && isItemAvailable(item);
        const safeImg = sanitizeWebUrl(item.imageUrl);
        const safeWeb = sanitizeWebUrl(item.webUrl);
        document.body.style.overflow = 'hidden';

        lbRoot.innerHTML = `
          <div class="image-lightbox-backdrop" id="lb-backdrop" role="dialog" aria-modal="true" aria-label="Vista ampliada de ${escapeHtml(item.name)}">
            <div class="lightbox-topbar">
              <div style="min-width:0">
                <div style="font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:#FFB3B8">${escapeHtml(item.category)}</div>
                <div style="font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(item.name)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                ${safeImg ? '<button type="button" class="icon-btn" id="lb-zoom-toggle" style="width:auto;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800" aria-label="Acercar o alejar imagen">🔍 1x</button>' : ''}
                <button type="button" class="icon-btn" id="lb-close" aria-label="Cerrar vista de imagen">✕</button>
              </div>
            </div>
            <div class="lightbox-stage" id="lb-stage">
              ${safeImg
                ? `<img id="lb-img" class="lightbox-img" src="${escapeHtml(safeImg)}" alt="${escapeHtml(item.name)}" referrerpolicy="no-referrer" /><div id="lb-img-fallback" class="lightbox-icon-stage" style="display:none">${getCategoryIcon(item.iconKey, '#D32F2F', 124)}</div>`
                : `<div class="lightbox-icon-stage">${getCategoryIcon(item.iconKey, '#D32F2F', 124)}</div>`}
            </div>
            <div class="lightbox-footer">
              ${item.description ? `<div style="font-size:13px;opacity:0.92;line-height:1.4">${escapeHtml(item.description)}</div>` : ''}
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
                <div>
                  <span style="font-size:19px;font-weight:900;color:#fff">${formatUsd(item.priceUsd)}</span>
                  <span style="font-size:12.5px;opacity:0.86;margin-left:6px">${formatBs(item.priceUsd, rate)}</span>
                </div>
                ${safeWeb ? `<a class="web-link-pill" style="background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.32);color:#fff" href="${escapeHtml(safeWeb)}" target="_blank" rel="noopener noreferrer">🌐 ${escapeHtml(getShortLinkHost(safeWeb))} ↗</a>` : ''}
              </div>
              <div class="card-btn-row">
                <button type="button" class="btn-outline" id="lb-btn-close" style="background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.28);color:#fff">Cerrar</button>
                <button type="button" class="btn-primary" id="lb-btn-order" ${canOrder ? '' : 'disabled'}>${fromCustomizerModal ? 'Volver al pedido' : (canOrder ? 'Pedir / Personalizar' : 'No disponible')}</button>
              </div>
            </div>
          </div>`;

        const imgEl = document.getElementById('lb-img');
        const stageEl = document.getElementById('lb-stage');
        const zoomBtn = document.getElementById('lb-zoom-toggle');
        const fallbackEl = document.getElementById('lb-img-fallback');
        let zoomed = false;
        const onEsc = (e) => {
          if (e.key === 'Escape') closeWithCleanup();
        };
        const closeWithCleanup = () => {
          document.removeEventListener('keydown', onEsc);
          closeProductImageViewer();
        };
        document.addEventListener('keydown', onEsc);

        const toggleZoom = () => {
          if (!imgEl) return;
          zoomed = !zoomed;
          imgEl.classList.toggle('zoomed', zoomed);
          if (stageEl) stageEl.classList.toggle('zoomed', zoomed);
          if (zoomBtn) zoomBtn.textContent = zoomed ? '🔍 1.75x' : '🔍 1x';
        };
        if (imgEl) {
          imgEl.onclick = (e) => { e.stopPropagation(); toggleZoom(); };
          imgEl.onerror = () => {
            imgEl.style.display = 'none';
            if (fallbackEl) fallbackEl.style.display = 'flex';
            if (zoomBtn) zoomBtn.style.display = 'none';
          };
        }
        if (zoomBtn) zoomBtn.onclick = toggleZoom;
        document.getElementById('lb-close').onclick = closeWithCleanup;
        document.getElementById('lb-btn-close').onclick = closeWithCleanup;
        stageEl.onclick = (e) => {
          if (e.target.id === 'lb-stage') closeWithCleanup();
        };
        document.getElementById('lb-backdrop').onclick = (e) => {
          if (e.target.id === 'lb-backdrop') closeWithCleanup();
        };
        document.getElementById('lb-btn-order').onclick = () => {
          closeWithCleanup();
          if (!fromCustomizerModal && canOrder) {
            openItemCustomizerModal(item);
          }
        };
      }

      function openItemCustomizerModal(item) {
        const rate = state.config.exchangeRateBsPerUsd;
        const store = state.stores.find((s) => s.id === item.storeId);
        const canOrder = (!store || store.isOpen !== false) && isItemAvailable(item);
        const safeItemWeb = sanitizeWebUrl(item.webUrl);
        const safeItemImg = sanitizeWebUrl(item.imageUrl);
        let qty = 1;
        let selected = [...(item.ingredients || [])];
        openModal(`
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div style="display:flex;gap:10px;align-items:center;min-width:0">
              <div class="menu-item-icon clickable-media" id="m-item-zoom" role="button" tabindex="0" aria-label="Ampliar imagen de ${escapeHtml(item.name)}" title="Toca para ampliar imagen">${renderVisualMedia(item.iconKey, item.imageUrl, 34, '#D32F2F', item.name)}${safeItemImg ? '<span class="zoom-badge" aria-hidden="true">🔍</span>' : ''}</div>
              <div style="min-width:0"><span class="cat-kicker">${escapeHtml(item.category)}</span><h3 style="margin:2px 0 0;font-size:19px;word-break:break-word">${escapeHtml(item.name)}</h3></div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
              <button class="chip" id="m-share-item" style="padding:6px 10px;font-size:12px" title="Copiar link del producto">🔗</button>
              <button class="chip" id="m-close">✕</button>
            </div>
          </div>
          ${item.description ? `<p style="margin:0;font-size:13px;color:var(--text-muted)">${escapeHtml(item.description)}</p>` : ''}
          ${safeItemWeb ? `<div><a class="web-link-pill web-link-pill--card" href="${escapeHtml(safeItemWeb)}" target="_blank" rel="noopener noreferrer">🌐 Ver enlace web del producto (${escapeHtml(getShortLinkHost(safeItemWeb))}) ↗</a></div>` : ''}
          <div style="background:var(--surface-variant);padding:10px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:13px;font-weight:700">Precio unitario</span>
            <span style="font-weight:900;color:var(--crimson-primary)">${formatUsd(item.priceUsd)} • ${formatBs(item.priceUsd, rate)}</span>
          </div>
          ${!canOrder ? '<div class="error-banner">Este producto no está disponible actualmente (agotado o local cerrado).</div>' : ''}
          ${(item.ingredients && item.ingredients.length) ? `
          <div>
            <div style="font-size:13px;font-weight:800;margin-bottom:8px">Opciones / Ingredientes (toca para quitar o incluir):</div>
            <div class="ing-chips">
              ${item.ingredients.map((ing) => `<button class="ing-chip selected" data-ing="${escapeHtml(ing)}">✓ ${escapeHtml(ing)}</button>`).join('')}
            </div>
          </div>` : ''}
          <div class="field-group">
            <label class="field-label" for="m-item-note">Nota especial (opcional)</label>
            <input id="m-item-note" class="input" type="text" placeholder="Ej: Sin cebolla, extra salsa de ajo" />
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div class="qty-stepper">
              <button class="qty-btn" id="m-qty-dec">−</button>
              <strong id="m-qty-val">${qty}</strong>
              <button class="qty-btn" id="m-qty-inc">+</button>
            </div>
            <button class="btn-primary" id="m-add-confirm" style="min-height:50px" ${canOrder ? '' : 'disabled'}>${canOrder ? `Agregar • ${formatUsd(item.priceUsd)} (${formatBs(item.priceUsd, rate)})` : 'No disponible'}</button>
          </div>`,
          (close) => {
            const sheet = document.querySelector('.bottom-sheet');
            document.getElementById('m-close').onclick = close;
            document.getElementById('m-share-item').onclick = () => copyShareLink('producto', item.id, item.name);
            const mZoom = document.getElementById('m-item-zoom');
            if (mZoom) {
              mZoom.onclick = () => openProductImageViewer(item, true);
              mZoom.onkeydown = (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProductImageViewer(item, true); }
              };
            }
            sheet.querySelectorAll('[data-ing]').forEach((btn) => {
              btn.onclick = () => {
                const ing = btn.getAttribute('data-ing');
                if (selected.includes(ing)) selected = selected.filter((x) => x !== ing);
                else selected.push(ing);
                btn.classList.toggle('selected');
                btn.textContent = (selected.includes(ing) ? '✓ ' : '') + ing;
              };
            });
            const updateTotals = () => {
              document.getElementById('m-qty-val').textContent = qty;
              if (canOrder) {
                document.getElementById('m-add-confirm').textContent = `Agregar • ${formatUsd(item.priceUsd * qty)} (${formatBs(item.priceUsd * qty, rate)})`;
              }
            };
            document.getElementById('m-qty-dec').onclick = () => { if (qty > 1) { qty--; updateTotals(); } };
            document.getElementById('m-qty-inc').onclick = () => { qty++; updateTotals(); };
            document.getElementById('m-add-confirm').onclick = async () => {
              if (!canOrder) return;
              const note = document.getElementById('m-item-note').value || '';
              await addItemToCart(item, qty, selected, note);
              close();
            };
          }
        );
      }

      function openEditMenuItemModal(itemOrStoreId, isNew) {
        const defaultStore = isNew ? state.stores.find((s) => s.id === itemOrStoreId) : null;
        const defaultIcon = (defaultStore && defaultStore.iconKey) ? defaultStore.iconKey : 'producto';
        const iconToCat = {
          burger: 'Hamburguesas',
          hotdog: 'Perros',
          empanada: 'Empanadas',
          arepa: 'Arepas',
          pepito: 'Pepitos',
          shawarma: 'Shawarmas',
          pizza: 'Pizzas',
          chicken: 'Pollo',
          fries: 'Papas',
          dulces: 'Dulces',
          soda: 'Refrescos',
          belleza: 'Belleza',
          medicina: 'Medicina',
          electronica: 'Electrónicos',
          producto: 'General'
        };
        const item = isNew
          ? { id: 'item_' + Date.now(), storeId: itemOrStoreId, name: '', category: iconToCat[defaultIcon] || 'General', description: '', priceUsd: 5.0, ingredients: [], iconKey: defaultIcon, isPopular: false, available: true, stock: null }

        const categories = ['Empanadas', 'Arepas', 'Belleza', 'Medicina', 'Electrónicos', 'Dulces', 'Hamburguesas', 'Perros', 'Pepitos', 'Shawarmas', 'Pizzas', 'Pollo', 'Papas', 'Refrescos', 'General'];

        const hasStockVal = item.stock !== null && item.stock !== undefined && item.stock !== '';
        openModal(`
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 style="margin:0">${isNew ? 'Nuevo Producto' : 'Editar ' + escapeHtml(item.name)}</h3>
            <button class="chip" id="m-close">✕</button>
          </div>
          <div class="field-group"><label class="field-label">Nombre del producto (cualquier producto)</label><input id="ed-name" class="input" type="text" placeholder="Ej: Empanada de Queso, Labial Mate, Acetaminofén, Audífonos..." value="${escapeHtml(item.name)}" /></div>
          <div class="field-group">
            <label class="field-label">Categoría</label>

              ${categories.map((c) => `<option value="${c}" ${c === item.category ? 'selected' : ''}>${c}</option>`).join('')}

            <label class="field-label">Especificar categoría personalizada</label>
            <input id="ed-cat-custom" class="input" type="text" placeholder="Ej: Cuidado Personal, Repuestos, Helados..." value="${isCustomCat ? escapeHtml(item.category) : ''}" />
          </div>
          <div class="field-group">
            <label class="field-label">Ícono visual del producto</label>

              if (showCustom) customCatInp.focus();

            document.querySelectorAll('[data-item-icon]').forEach((btn) => {
              btn.onclick = () => {
                selectedIconKey = btn.getAttribute('data-item-icon');
                document.querySelectorAll('[data-item-icon]').forEach((b) => b.classList.toggle('selected', b === btn));
              };

            if (!isNew) {

                GitHubSync.triggerAutoCloudPush('Producto eliminado');
              };

            document.getElementById('ed-save').onclick = async () => {
              const name = document.getElementById('ed-name').value.trim();
              const priceUsd = parseFloat(document.getElementById('ed-price').value);
              if (!name || !priceUsd || priceUsd <= 0) return showToast('Completa nombre y precio válido');
              const rawWebUrl = document.getElementById('ed-web-url').value.trim();
              const cleanWebUrl = sanitizeWebUrl(rawWebUrl);
              if (rawWebUrl && !cleanWebUrl) return showToast('Link web del producto inválido (usa https://...)');
              const rawImgUrl = document.getElementById('ed-img-url').value.trim();
              const cleanImgUrl = sanitizeWebUrl(rawImgUrl);
              if (rawImgUrl && !cleanImgUrl) return showToast('Link de imagen inválido (usa https://...)');

              let finalCategory = catSel.value;
              if (finalCategory === '__CUSTOM__') {
                finalCategory = customCatInp.value.trim() || 'General';
              }
              const rawStock = document.getElementById('ed-stock').value.trim();
              const stockVal = rawStock === '' ? null : Math.max(0, Math.floor(Number(rawStock)));
              let availVal = document.getElementById('ed-available').value === 'true';
              if (stockVal !== null && stockVal <= 0) availVal = false;
              const updated = {
                ...item, name,
                category: finalCategory,
                iconKey: selectedIconKey,
                priceUsd,
                available: availVal,
                stock: stockVal,
                webUrl: cleanWebUrl,
                imageUrl: cleanImgUrl,
                description: document.getElementById('ed-desc').value.trim(),
                ingredients: document.getElementById('ed-ings').value.split(',').map((s) => s.trim()).filter(Boolean)
              };
              await ArismendiDB.saveMenuItem(updated);
              const idx = state.menuItems.findIndex((x) => x.id === updated.id);
              if (idx >= 0) state.menuItems[idx] = updated; else state.menuItems.push(updated);
              close(); showToast('Producto guardado'); render();
              GitHubSync.triggerAutoCloudPush('Producto e inventario');
            };
          }
        );
      }

      async function addItemToCart(item, qty, selectedIngredients, note) {
        const store = state.stores.find((s) => s.id === item.storeId);
        if (store && store.isOpen === false) {
          showToast('Este local está cerrado temporalmente');
          return;
        }
        if (!isItemAvailable(item)) {
          showToast('Este producto está agotado');
          return;
        }
        const cleanNote = (note || '').trim();
        const existing = state.cart.find((c) => c.menuItemId === item.id && JSON.stringify(c.selectedIngredients) === JSON.stringify(selectedIngredients) && c.note === cleanNote);
        if (existing) existing.quantity += qty;
        else state.cart.push({ cartItemId: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), menuItemId: item.id, storeId: item.storeId, storeName: store ? store.name : '', name: item.name, priceUsd: item.priceUsd, quantity: qty, allIngredients: item.ingredients, selectedIngredients, note: cleanNote });
        await ArismendiDB.replaceCart(state.cart);
        recordActivity('add_to_cart', `${qty}x ${item.name} (${store ? store.name : ''})`);
        showToast(`${qty}x ${item.name} agregado`);
        render();
      }

      function openWhatsAppUrlSafely(intlPhone, text) {
        if (window.AndroidWhatsApp && typeof window.AndroidWhatsApp.sendInvoiceText === 'function') {
          window.AndroidWhatsApp.sendInvoiceText(intlPhone, text);
          return;
        }
        const url = `https://wa.me/${intlPhone}?text=${encodeURIComponent(text)}`;
        const popup = window.open(url, '_blank');
        if (!popup) {
          setTimeout(() => { window.location.href = url; }, 120);
        }
      }

        document.querySelectorAll('[data-cart-dec]').forEach((el) => {
          el.onclick = async () => {
            const id = el.getAttribute('data-cart-dec');
            state.cart = state.cart.map((c) => (c.cartItemId === id ? { ...c, quantity: c.quantity - 1 } : c)).filter((c) => c.quantity > 0);
            await ArismendiDB.replaceCart(state.cart); render();
          };
        });

        const refreshBubble = () => { const b = document.querySelector('.wa-preview-bubble'); if (b) b.textContent = buildWhatsAppInvoice('DEA-PREVIEW').text; };
        if (byId('input-address')) byId('input-address').oninput = (e) => { state.deliveryInfo.address = e.target.value; refreshBubble(); persistDeliveryPreferences(); };
        if (byId('input-ref')) byId('input-ref').oninput = (e) => { state.deliveryInfo.reference = e.target.value; refreshBubble(); persistDeliveryPreferences(); };
        if (byId('input-name')) byId('input-name').oninput = (e) => { state.deliveryInfo.customerName = e.target.value; refreshBubble(); persistDeliveryPreferences(); };

        document.querySelectorAll('[data-pay-method]').forEach((el) => { el.onclick = () => { state.deliveryInfo.paymentMethod = el.getAttribute('data-pay-method'); persistDeliveryPreferences(); render(); }; });
        document.querySelectorAll('[data-bill-chip]').forEach((el) => { el.onclick = () => { state.deliveryInfo.cashBillNote = el.getAttribute('data-bill-chip'); render(); }; });
        if (byId('input-cash-bill')) byId('input-cash-bill').oninput = (e) => { state.deliveryInfo.cashBillNote = e.target.value; refreshBubble(); };

        if (byId('btn-copy-pm')) byId('btn-copy-pm').onclick = async () => {

          if (navigator.clipboard) await navigator.clipboard.writeText(pmText);
          showToast('Datos de Pago Móvil copiados');
        };
        if (byId('btn-copy-invoice')) byId('btn-copy-invoice').onclick = async () => {
          if (navigator.clipboard) await navigator.clipboard.writeText(buildWhatsAppInvoice().text);
          showToast('Factura copiada');
        };
        if (byId('btn-view-loyalty-msg')) byId('btn-view-loyalty-msg').onclick = openLoyaltyRewardModal;
        if (byId('btn-send-whatsapp')) byId('btn-send-whatsapp').onclick = async () => {
          if (!state.deliveryInfo.address.trim()) { showToast('Ingresa tu dirección de entrega'); byId('input-address')?.focus(); return; }
          const { invoiceCode, text } = buildWhatsAppInvoice();
          const { totalUsd } = getCartTotals();
          const uid = (state.userProfile && state.userProfile.userId) || '';
          const storeNames = [...new Set(state.cart.map((c) => c.storeName))].join(' / ');
          const usedFreeReward = Boolean(state.userProfile && state.userProfile.hasFreeDeliveryReward);
          const intlPhone = toWhatsAppIntlPhone(state.config.whatsappPhone);

          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).catch(() => {});
            }
          } catch (_) {}

          openWhatsAppUrlSafely(intlPhone, text);
          showToast('Abriendo factura en WhatsApp...');

          const orderRecord = {
            id: 'ord_' + Date.now(),
            userId: uid,
            invoiceCode,
            createdAt: Date.now(),
            storeNames,
            items: state.cart,
            rate: state.config.exchangeRateBsPerUsd,
            totalUsd,
            freeDeliveryApplied: usedFreeReward,
            paymentMethod: state.deliveryInfo.paymentMethod === 'PAGO_MOVIL' ? 'Pago Móvil' : 'Divisa Efectivo',
            address: state.deliveryInfo.address.trim(),
            invoiceText: text
          };

          let unlockedSeventhNow = false;
          try {
            await ArismendiDB.saveOrder(orderRecord);
            state.orders.unshift(orderRecord);

            if (state.userProfile) {
              state.userProfile.totalOrders = Number(state.userProfile.totalOrders || 0) + 1;
              state.userProfile.totalSpentUsd = Number(state.userProfile.totalSpentUsd || 0) + totalUsd;
              state.userProfile.itemStats = state.userProfile.itemStats || {};
              state.cart.forEach((c) => {
                state.userProfile.itemStats[c.name] = Number(state.userProfile.itemStats[c.name] || 0) + Number(c.quantity || 1);
              });
              state.userProfile.savedDeliveryInfo = {
                customerName: state.deliveryInfo.customerName || '',
                address: state.deliveryInfo.address || '',
                reference: state.deliveryInfo.reference || '',
                paymentMethod: state.deliveryInfo.paymentMethod || 'PAGO_MOVIL'
              };

              if (usedFreeReward) {
                state.userProfile.hasFreeDeliveryReward = false;
                state.userProfile.loyaltyNotificationPending = false;
                state.userProfile.loyaltyDeliveriesCount = 0;
                state.userProfile.freeDeliveriesRedeemed = Number(state.userProfile.freeDeliveriesRedeemed || 0) + 1;
              } else {
                const nextCount = Number(state.userProfile.loyaltyDeliveriesCount || 0) + 1;
                if (nextCount >= 6) {
                  state.userProfile.loyaltyDeliveriesCount = 0;
                  state.userProfile.hasFreeDeliveryReward = true;
                  state.userProfile.loyaltyNotificationPending = true;
                  unlockedSeventhNow = true;
                } else {
                  state.userProfile.loyaltyDeliveriesCount = nextCount;
                }
              }

        if (byId('btn-save-gh')) byId('btn-save-gh').onclick = async () => {

        if (byId('btn-test-gh')) byId('btn-test-gh').onclick = async () => {

          state.ghStatusBanner = { type: 'info', message: 'Subiendo locales, menú, inventario, precios y tasa del día a GitHub...' };

        if (byId('btn-push-gh')) byId('btn-push-gh').onclick = runPushToGitHub;
        if (byId('btn-push-gh-menu')) byId('btn-push-gh-menu').onclick = runPushToGitHub;

          byId('input-import-db').onchange = async () => {

        document.querySelectorAll('[data-admin-edit-item]').forEach((el) => { el.onclick = () => { const item = state.menuItems.find((x) => x.id === el.getAttribute('data-admin-edit-item')); if (item) openEditMenuItemModal(item, false); }; });
        document.querySelectorAll('[data-admin-toggle-item]').forEach((el) => {
          el.onclick = async () => {
            const item = state.menuItems.find((x) => x.id === el.getAttribute('data-admin-toggle-item'));
            if (!item) return;
            const currentlyAvail = isItemAvailable(item);
            const nextAvail = !currentlyAvail;
            const nextStock = nextAvail && item.stock !== null && Number(item.stock) <= 0 ? null : item.stock;

        document.querySelectorAll('[data-admin-add-item]').forEach((el) => { el.onclick = () => openEditMenuItemModal(el.getAttribute('data-admin-add-item'), true); });

      // Sincronización automática en la nube en tiempo real para TODOS los dispositivos instalados
      let realtimeSyncTimer = null;
      let lastApiCheckAt = 0;
      function startRealtimeSyncLoop() {
        if (realtimeSyncTimer) return;
        const runBackgroundPull = async (forceApiCheck = false) => {
          if (document.hidden || state.isSyncingGitHub) return;
          const hasTok = GitHubSync.hasSavedToken();
          const now = Date.now();
          // Con token: usa Contents API cada 15s (5,000 req/hr). Sin token: Contents API cada 75s (<48 req/hr) + raw/Pages cada 20s.
          const minApiInterval = hasTok ? 12000 : 75000;
          const useApi = hasTok || (forceApiCheck && (now - lastApiCheckAt >= 30000)) || (now - lastApiCheckAt >= minApiInterval);
          if (useApi) lastApiCheckAt = now;
          try {
            const updated = await GitHubSync.pullRemoteCatalog(false, null, { useApi });
            if (updated) {
              const verTag = GitHubSync.getCreds().lastRemoteReleaseTag || 'nueva';
              render();
              showToast(`🔄 Versión ${verTag} descargada: precios, stock y locales actualizados`);
            }
          } catch (_) {}
        };
        realtimeSyncTimer = setInterval(() => runBackgroundPull(false), 15000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) runBackgroundPull(true);
        });
        window.addEventListener('focus', () => runBackgroundPull(true));
        window.addEventListener('online', () => runBackgroundPull(true));
      }

      function openMandatoryStartupTokenGate() {
        const root = document.getElementById('gate-root');
        if (!root || root.innerHTML.trim()) return;
        const creds = GitHubSync.getCreds();
        document.body.style.overflow = 'hidden';
        root.innerHTML = `
          <div class="startup-gate-backdrop" id="startup-gate-backdrop" role="dialog" aria-modal="true" aria-labelledby="gate-title">

              <div class="startup-gate-hero">

                <div style="font-size:11.5px;font-weight:800;letter-spacing:1.2px;color:var(--crimson-primary);text-transform:uppercase">Delivery Express Arismendi</div>
                <h2 id="gate-title" style="margin:0;font-size:21px;font-weight:900;color:var(--text-main)">Conectar con GitHub</h2>
                <p style="margin:0;font-size:13px;color:var(--text-muted);line-height:1.4">El repositorio requiere autenticación para descargar el catálogo inicial. Introduce el <b>Token Personal de GitHub</b>.</p>
              </div>

              <div class="startup-repo-summary">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                  <strong style="color:var(--text-main)">Repositorio preconfigurado</strong>

                </div>
                <div class="startup-repo-pills">
                  <span class="startup-repo-pill">👤 <span id="gate-pill-owner">${escapeHtml(creds.owner || 'deliveryexpressarismendi')}</span></span>
                  <span class="startup-repo-pill">📦 <span id="gate-pill-repo">${escapeHtml(creds.repo || 'delivery')}</span></span>
                  <span class="startup-repo-pill">🌿 <span id="gate-pill-branch">${escapeHtml(creds.branch || 'main')}</span></span>
                  <span class="startup-repo-pill">📄 <span id="gate-pill-path">${escapeHtml(creds.filePath || 'catalog.json')}</span></span>
                </div>
                <div id="gate-repo-fields" style="display:none;flex-direction:column;gap:8px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--outline)">
                  <div class="field-group"><label class="field-label" for="gate-owner">Usuario u Organización (Owner)</label><input id="gate-owner" class="input" type="text" value="${escapeHtml(creds.owner || 'deliveryexpressarismendi')}" autocomplete="off" /></div>
                  <div class="field-group"><label class="field-label" for="gate-repo">Nombre del Repositorio</label><input id="gate-repo" class="input" type="text" value="${escapeHtml(creds.repo || 'delivery')}" autocomplete="off" /></div>
                  <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:8px">
                    <div class="field-group"><label class="field-label" for="gate-branch">Rama</label><input id="gate-branch" class="input" type="text" value="${escapeHtml(creds.branch || 'main')}" autocomplete="off" /></div>
                    <div class="field-group"><label class="field-label" for="gate-path">Archivo de Catálogo</label><input id="gate-path" class="input" type="text" value="${escapeHtml(creds.filePath || 'catalog.json')}" autocomplete="off" /></div>
                  </div>
                </div>
              </div>

              <div class="field-group">
                <label class="field-label" for="gate-token">Token Personal de GitHub (PAT) *</label>
                <div class="pw-input-wrap">
                  <input id="gate-token" class="input" type="password" placeholder="Pega aquí tu token (ghp_... o github_pat_...)" autocomplete="off" />
                  <button type="button" class="pw-toggle-btn" id="btn-toggle-gate-token" aria-label="Mostrar u ocultar token">👁️</button>
                </div>
              </div>

              <div id="gate-status" class="error-banner" style="display:none"></div>

              <button class="btn-primary" id="btn-gate-submit" style="min-height:50px;font-size:15px">🚀 Cargar Aplicación</button>
              <div style="font-size:11.5px;color:var(--text-muted);text-align:center">Tu token se guarda únicamente de forma segura en este dispositivo.</div>
            </div>
          </div>`;

        const ownerInp = document.getElementById('gate-owner');
        const repoInp = document.getElementById('gate-repo');
        const branchInp = document.getElementById('gate-branch');
        const pathInp = document.getElementById('gate-path');
        const tokenInp = document.getElementById('gate-token');
        const statusEl = document.getElementById('gate-status');
        const submitBtn = document.getElementById('btn-gate-submit');
        const repoFieldsBox = document.getElementById('gate-repo-fields');

        document.getElementById('btn-gate-edit-repo').onclick = () => {
          const isOpen = repoFieldsBox.style.display === 'flex';
          repoFieldsBox.style.display = isOpen ? 'none' : 'flex';
        };
        const syncPills = () => {
          document.getElementById('gate-pill-owner').textContent = ownerInp.value.trim() || '—';
          document.getElementById('gate-pill-repo').textContent = repoInp.value.trim() || '—';
          document.getElementById('gate-pill-branch').textContent = branchInp.value.trim() || 'main';
          document.getElementById('gate-pill-path').textContent = pathInp.value.trim() || 'catalog.json';
        };
        [ownerInp, repoInp, branchInp, pathInp].forEach((inp) => inp.addEventListener('input', syncPills));

        document.getElementById('btn-toggle-gate-token').onclick = () => {
          tokenInp.type = tokenInp.type === 'password' ? 'text' : 'password';
        };

        setTimeout(() => tokenInp.focus(), 80);

        const setGateStatus = (msg, isError = true) => {
          if (!msg) {
            statusEl.style.display = 'none';
            return;
          }
          statusEl.style.display = 'block';
          statusEl.style.background = isError ? '#FFEBEE' : '#E3F2FD';
          statusEl.style.color = isError ? '#B00020' : '#0D47A1';
          statusEl.style.borderColor = isError ? 'rgba(176, 0, 32, 0.25)' : '#90CAF9';
          statusEl.textContent = msg;
        };

        const submitGate = async () => {
          const enteredCreds = {
            owner: ownerInp.value.trim(),
            repo: repoInp.value.trim(),
            branch: branchInp.value.trim() || 'main',
            filePath: pathInp.value.trim().replace(/^\/+/, '') || 'catalog.json',
            token: tokenInp.value.trim()
          };
          if (!enteredCreds.owner || !enteredCreds.repo) {
            repoFieldsBox.style.display = 'flex';
            return setGateStatus('Verifica el Usuario y Repositorio de GitHub.');
          }
          if (!enteredCreds.token) {
            tokenInp.focus();
            return setGateStatus('Debes introducir el Token Personal de GitHub para cargar la aplicación.');
          }

          submitBtn.disabled = true;
          submitBtn.textContent = '⏳ Sincronizando con GitHub...';
          setGateStatus('Conectando con el repositorio y descargando catálogo en tiempo real...', false);

          try {
            await GitHubSync.testConnection(enteredCreds, false);
            await GitHubSync.pullRemoteCatalog(true, enteredCreds, { useApi: true });
            const finalPath = (state.config && state.config.repoSync && state.config.repoSync.filePath) || enteredCreds.filePath;
            await GitHubSync.saveCreds({ ...enteredCreds, filePath: finalPath });
            root.innerHTML = '';
            document.body.style.overflow = '';
            startRealtimeSyncLoop();
            render();
            applyPendingDeepLink();
            showToast('✅ Aplicación cargada y sincronizada en tiempo real');
            if (state.userProfile && state.userProfile.loyaltyNotificationPending) {
              setTimeout(() => openLoyaltyRewardModal(), 260);
            }
          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 Cargar Aplicación';
            setGateStatus(err && err.message ? err.message : 'No se pudo conectar con GitHub. Revisa tu token.');
          }
        };

        submitBtn.onclick = submitGate;
        tokenInp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') submitGate();
        });
      }

      let pendingDeepLink = (() => {
        try {
          const sp = new URLSearchParams(window.location.search || '');
          return {
            storeId: (sp.get('local') || sp.get('store') || '').trim(),
            itemId: (sp.get('producto') || sp.get('item') || '').trim()
          };
        } catch (_) {
          return { storeId: '', itemId: '' };
        }
      })();

      function applyPendingDeepLink() {
        if (!pendingDeepLink.itemId && !pendingDeepLink.storeId) return;
        if (pendingDeepLink.itemId) {
          const item = state.menuItems.find((i) => i.id === pendingDeepLink.itemId);
          if (item) {
            pendingDeepLink = { storeId: '', itemId: '' };
            state.selectedStoreId = item.storeId;
            state.selectedCategory = 'Todos';
            state.view = 'store';
            render();
            setTimeout(() => openItemCustomizerModal(item), 120);
            return;
          }
        }
        if (pendingDeepLink.storeId) {
          const st = state.stores.find((s) => s.id === pendingDeepLink.storeId);
          if (st) {
            pendingDeepLink = { storeId: '', itemId: '' };
            state.selectedStoreId = st.id;
            state.selectedCategory = 'Todos';
            state.view = 'store';
            render();
          }
        }
      }

      // Pantalla de bienvenida animada antes de iniciar la app
      let splashDismissed = false;
      let initialBootReady = false;
      let pendingLoyaltyAfterSplash = false;

      function onBootReadyAndSplashDone() {
        if (!splashDismissed || !initialBootReady) return;
        startRealtimeSyncLoop();
        const outcome = GitHubSync.getLastPublicOutcome();
        if (!GitHubSync.hasSavedToken() && !GitHubSync.hasEverSynced() && (outcome === 'unauthorized' || outcome === 'not_found_or_private')) {
          openMandatoryStartupTokenGate();
          return;
        }
        applyPendingDeepLink();
        if (pendingLoyaltyAfterSplash) {
          pendingLoyaltyAfterSplash = false;
          setTimeout(() => openLoyaltyRewardModal(), 260);
        }
      }

      function dismissSplashScreen() {
        if (splashDismissed) return;
        splashDismissed = true;
        const splash = document.getElementById('splash-screen');
        const appRoot = document.getElementById('app');
        if (splash) {
          splash.classList.add('splash-hide');
          setTimeout(() => splash.remove(), 440);
        }
        if (appRoot) {
          appRoot.classList.remove('view-accordion-enter');
          void appRoot.offsetWidth;
          appRoot.classList.add('view-accordion-enter');
        }
        onBootReadyAndSplashDone();
      }

      const splashEl = document.getElementById('splash-screen');
      if (splashEl) {
        splashEl.addEventListener('click', dismissSplashScreen);
      }
      setTimeout(dismissSplashScreen, 1950);

      // Render inmediato al instante + sincronización asíncrona con IndexedDB y GitHub
      render();

      if ((location.protocol === 'http:' || location.protocol === 'https:') && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        state.deferredInstallPrompt = e;
        if (state.view === 'home') render();
      });

      ArismendiDB.loadAllState().then(async (loaded) => {
        state.config = loaded.config;
        state.stores = loaded.stores;
        state.menuItems = loaded.menuItems;
        state.cart = loaded.cart;
        state.orders = loaded.orders;
        state.userProfile = loaded.userProfile;
        state.usageLogs = loaded.usageLogs || [];

        if (!state.hasEditedDelivery && state.userProfile && state.userProfile.savedDeliveryInfo) {
          const saved = state.userProfile.savedDeliveryInfo;
          state.deliveryInfo.customerName = saved.customerName || '';
          state.deliveryInfo.address = saved.address || '';
          state.deliveryInfo.reference = saved.reference || '';
          if (saved.paymentMethod) state.deliveryInfo.paymentMethod = saved.paymentMethod;
        }
        if (state.userProfile) {
          if (state.userProfile.loyaltyDeliveriesCount === undefined) {
            const legacyTotal = Number(state.userProfile.totalOrders || 0);
            const mod = legacyTotal % 7;
            state.userProfile.loyaltyDeliveriesCount = mod === 6 ? 0 : mod;
            if (legacyTotal > 0 && mod === 6) {
              state.userProfile.hasFreeDeliveryReward = true;
              state.userProfile.loyaltyNotificationPending = true;
            }
          }
          state.userProfile.sessionCount = Number(state.userProfile.sessionCount || 0) + 1;
          state.userProfile.lastActiveAt = Date.now();
          await ArismendiDB.saveUserProfile(state.userProfile);
        }
        await recordActivity('app_open', 'Inicio de sesión en la aplicación');
        if (state.userProfile && state.userProfile.loyaltyNotificationPending) {
          pendingLoyaltyAfterSplash = true;
        }
        render();

        // Desde instalación desde cero: descarga inmediatamente configuración, locales, productos, precios, inventario, tasa y delivery desde GitHub
        const splashHint = document.querySelector('.splash-skip-hint');
        if (splashHint) splashHint.textContent = 'Sincronizando catálogo y tasa desde la nube...';
        try {
          lastApiCheckAt = Date.now();
          const updated = await GitHubSync.pullRemoteCatalog(false, null, { useApi: true });
          if (updated) {
            render();
            if (splashDismissed) showToast('☁️ Catálogo descargado desde GitHub');
          }
        } catch (_) {}
        initialBootReady = true;
        onBootReadyAndSplashDone();
      }).catch(() => {
        initialBootReady = true;
        onBootReadyAndSplashDone();
      });
    })();
  </script>
</body>
</html>
